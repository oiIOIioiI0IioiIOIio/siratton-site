<!DOCTYPE html>
<html lang="fr" style="background-color: #000000;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data-visualisation — Côme Nottaris</title>
  <link rel="shortcut icon" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/reset.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/site.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { overflow-x: hidden; }

    #universe {
      width: 100%;
      position: relative;
      border-radius: 0.75rem;
      overflow: hidden;
      cursor: grab;
      margin-top: 1rem;
    }
    #universe:active { cursor: grabbing; }
    #universe svg { display: block; width: 100%; height: auto; }

    .hint {
      text-align: center;
      color: #444;
      font-size: 0.8rem;
      margin-top: 0.4rem;
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    /* ── Detail panel ────────────────────────────────────────── */
    #detail-panel {
      position: fixed;
      top: 0; right: -480px;
      width: min(440px, 90vw);
      height: 100vh;
      background: rgba(5,5,12,0.97);
      border-left: 1px solid #1a2a44;
      backdrop-filter: blur(20px);
      z-index: 2000;
      transition: right 0.4s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
      box-shadow: -8px 0 40px rgba(0,0,0,0.7);
    }
    #detail-panel.open { right: 0; }
    #detail-panel .panel-inner { padding: 2rem 1.5rem 3rem; }
    #detail-panel .close-btn {
      position: absolute; top: 16px; right: 16px;
      background: none; border: 1px solid #333; border-radius: 50%;
      width: 36px; height: 36px; color: #888; font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; z-index: 10;
    }
    #detail-panel .close-btn:hover { border-color: #84ADDC; color: #fff; }
    .panel-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .panel-title {
      font-size: 1.5rem; font-weight: 700; color: #fff;
      margin-bottom: 0.5rem; font-family: 'Inter', sans-serif;
    }
    .panel-subtitle {
      font-size: 0.9rem; color: #84ADDC; font-weight: 600;
      margin-bottom: 1rem; font-family: 'Inter', sans-serif;
    }
    .panel-desc {
      font-size: 0.9rem; color: #aaa; line-height: 1.7;
      margin-bottom: 1.5rem; font-family: 'Inter', sans-serif;
    }
    .panel-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
    .panel-tag {
      font-size: 0.7rem; font-weight: 600; padding: 3px 10px;
      border-radius: 1rem; border: 1px solid #333; color: #888;
      font-family: 'Inter', sans-serif;
    }
    .panel-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.85rem; font-weight: 600; color: #84ADDC;
      text-decoration: none; padding: 8px 16px;
      border-radius: 0.4rem; border: 1px solid #84ADDC44;
      transition: all 0.2s; margin-right: 0.5rem; margin-bottom: 0.5rem;
      font-family: 'Inter', sans-serif;
    }
    .panel-link:hover { background: #84ADDC15; border-color: #84ADDC; color: #fff; }
    .panel-tools { margin-top: 1.5rem; }
    .panel-tools h3 {
      font-size: 0.85rem; color: #666; text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 0.75rem;
      font-family: 'Inter', sans-serif;
    }
    .tool-bar {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 0.6rem; font-family: 'Inter', sans-serif;
    }
    .tool-name { font-size: 0.8rem; color: #ccc; width: 80px; font-weight: 600; }
    .tool-track { flex: 1; height: 4px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
    .tool-fill { height: 100%; border-radius: 2px; width: 0; transition: width 0.8s ease; }

    /* ── Tooltip ──────────────────────────────────────────────── */
    .d3-tooltip {
      position: absolute; pointer-events: none;
      background: rgba(8,8,16,0.95);
      border: 1px solid #84ADDC; border-radius: 8px;
      padding: 12px 16px; font-family: 'Inter', sans-serif;
      font-size: 13px; color: #fff; line-height: 1.5;
      z-index: 9999; backdrop-filter: blur(8px);
      box-shadow: 0 4px 30px rgba(0,0,0,0.6);
      max-width: 260px; opacity: 0; transition: opacity 0.15s;
    }
    .d3-tooltip.visible { opacity: 1; }
    .d3-tooltip .tt-title { font-weight: 700; color: #FFD682; margin-bottom: 3px; font-size: 14px; }
    .d3-tooltip .tt-sub { color: #84ADDC; font-size: 11px; }

    @media (max-width: 560px) {
      #detail-panel { width: 100vw; }
      .panel-inner { padding: 1.5rem 1rem 2rem; }
    }
  </style>
</head>
<body class="page" id="datavisualisation.head" style="background-color: #000000;">

  <div class="page-wrapper">

  <div class="d3-tooltip" id="tooltip"></div>

<script>

    tags: ['Journalisme', 'R\u00e9daction', 'Enqu\u00eate', 'Reportage'],

    tags: ['Base de donn\u00e9es', 'Notion', 'Collaboratif', 'Organisation'],
    tools: [{ name: 'Notion', pct: 90, color: '#fff' }, { name: 'Donn\u00e9es', pct: 75, color: '#c792ea' }],

var SKILLS = [
  { id: 'python', label: 'Python', color: '#4B8BBE', r: 16 },
  { id: 'd3js', label: 'D3.js', color: '#f9a03c', r: 16 },
  { id: 'flourish', label: 'Flourish', color: '#e06c75', r: 13 },
  { id: 'qgis', label: 'QGIS', color: '#93b023', r: 12 },
  { id: 'r_lang', label: 'R', color: '#276DC3', r: 12 },
  { id: 'scraping', label: 'Scraping', color: '#56b6c2', r: 13 },
  { id: 'sql', label: 'SQL', color: '#FFD682', r: 11 },
  { id: 'datawrapper', label: 'Datawrap.', color: '#84ADDC', r: 11 },
  { id: 'git', label: 'Git', color: '#6dd47e', r: 11 },
  { id: 'htmlcss', label: 'HTML/CSS', color: '#e06c75', r: 12 }
];

var PROJ_SKILL_LINKS = [
  { source: 'rsf', target: 'python' }, { source: 'rsf', target: 'qgis' },
  { source: 'rsf', target: 'r_lang' }, { source: 'rsf', target: 'd3js' },
  { source: 'basta', target: 'python' }, { source: 'basta', target: 'scraping' },
  { source: 'basta', target: 'flourish' },
  { source: 'stup', target: 'flourish' }, { source: 'stup', target: 'datawrapper' },
  { source: 'auto', target: 'htmlcss' }, { source: 'auto', target: 'python' },
  { source: 'auto', target: 'scraping' }, { source: 'auto', target: 'git' },
  { source: 'fea', target: 'sql' }
];

/* ═══════════════════════════════════════════════════════════════
   TOOLTIP
   ═══════════════════════════════════════════════════════════════ */
var ttEl = d3.select('#tooltip');
function showTip(evt, html) {
  ttEl.html(html).classed('visible', true);
  var tt = ttEl.node();
  var px = evt.pageX + 14, py = evt.pageY - 12;
  var maxX = window.innerWidth - tt.offsetWidth - 20;
  ttEl.style('left', Math.min(px, maxX) + 'px').style('top', py + 'px');
}
function hideTip() { ttEl.classed('visible', false); }

/* ═══════════════════════════════════════════════════════════════
   DETAIL PANEL
   ═══════════════════════════════════════════════════════════════ */
var panel = document.getElementById('detail-panel');
var panelContent = document.getElementById('panel-content');
document.getElementById('panel-close').addEventListener('click', function() { panel.classList.remove('open'); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') panel.classList.remove('open'); });

function openProject(proj) {
  var toolsHTML = '';
  if (proj.tools && proj.tools.length) {
    toolsHTML = '<div class="panel-tools"><h3>Outils utilis\u00e9s</h3>' +
      proj.tools.map(function(t) {
        return '<div class="tool-bar"><span class="tool-name">' + t.name +
          '</span><div class="tool-track"><div class="tool-fill" style="background:' +
          t.color + ';" data-pct="' + t.pct + '"></div></div></div>';
      }).join('') + '</div>';
  }

  var linksHTML = proj.links.map(function(l) {
    return '<a class="panel-link" href="' + l.href + '"' +
      (l.ext ? ' target="_blank"' : '') + '>' + l.text + '</a>';
  }).join('');

  var tagsHTML = proj.tags.map(function(t) {
    return '<span class="panel-tag">' + t + '</span>';
  }).join('');

  panelContent.innerHTML =
    '<div class="panel-icon">' + proj.icon + '</div>' +
    '<div class="panel-title">' + proj.label.replace(/\n/g, ' ') + '</div>' +
    '<div class="panel-subtitle">' + proj.subtitle + '</div>' +
    '<div class="panel-tags">' + tagsHTML + '</div>' +
    '<div class="panel-desc">' + proj.desc + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;">' + linksHTML + '</div>' +
    toolsHTML;

  panel.classList.add('open');

  setTimeout(function() {
    var fills = panelContent.querySelectorAll('.tool-fill');
    for (var i = 0; i < fills.length; i++) {
      fills[i].style.width = fills[i].dataset.pct + '%';
    }
  }, 200);
}

/* ═══════════════════════════════════════════════════════════════
   BUILD THE UNIVERSE
   ═══════════════════════════════════════════════════════════════ */
(function() {
  var container = document.querySelector('#universe');
  var cW = container.getBoundingClientRect().width;
  var W = Math.min(cW, 1100);
  var H = Math.max(520, Math.min(W * 0.65, 640));

  var svg = d3.select('#universe').append('svg')
    .attr('viewBox', '0 0 ' + W + ' ' + H)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  var defs = svg.append('defs');

  /* Glow filter */
  var glow = defs.append('filter').attr('id', 'glow')
    .attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
  glow.append('feGaussianBlur').attr('stdDeviation', '6').attr('result', 'blur');
  var glowMerge = glow.append('feMerge');
  glowMerge.append('feMergeNode').attr('in', 'blur');
  glowMerge.append('feMergeNode').attr('in', 'SourceGraphic');

  /* Strong glow for center */
  var glowS = defs.append('filter').attr('id', 'glow-s')
    .attr('x', '-80%').attr('y', '-80%').attr('width', '260%').attr('height', '260%');
  glowS.append('feGaussianBlur').attr('stdDeviation', '12').attr('result', 'blur');
  var glowSM = glowS.append('feMerge');
  glowSM.append('feMergeNode').attr('in', 'blur');
  glowSM.append('feMergeNode').attr('in', 'SourceGraphic');

  /* Background gradient */
  var bgGrad = defs.append('radialGradient').attr('id', 'bg-grad');
  bgGrad.append('stop').attr('offset', '0%').attr('stop-color', '#080c1a');
  bgGrad.append('stop').attr('offset', '50%').attr('stop-color', '#040610');
  bgGrad.append('stop').attr('offset', '100%').attr('stop-color', '#000003');

  svg.append('rect').attr('width', W).attr('height', H).attr('fill', 'url(#bg-grad)').attr('rx', 12);

  /* ── Star field ─────────────────────────────────────────── */
  var starLayer = svg.append('g');
  var i;
  for (i = 0; i < 250; i++) {
    starLayer.append('circle')
      .attr('cx', Math.random() * W).attr('cy', Math.random() * H)
      .attr('r', Math.random() * 1.3)
      .attr('fill', '#fff')
      .attr('opacity', 0.04 + Math.random() * 0.3);
  }

  /* Nebula blobs */
  var nebulae = [[W*0.2, H*0.3, '#84ADDC', 140], [W*0.78, H*0.6, '#c30000', 110], [W*0.5, H*0.15, '#FFD682', 90], [W*0.65, H*0.8, '#6dd47e', 80]];
  nebulae.forEach(function(n) {
    svg.append('circle').attr('cx', n[0]).attr('cy', n[1]).attr('r', n[3])
      .attr('fill', n[2]).attr('opacity', 0.025);
  });

  /* ── Orbit rings ────────────────────────────────────────── */
  var orbits = svg.append('g');
  [130, 210, 290].forEach(function(r) {
    orbits.append('circle').attr('cx', W/2).attr('cy', H/2).attr('r', r)
      .attr('fill', 'none').attr('stroke', '#0d1525').attr('stroke-width', 0.8)
      .attr('stroke-dasharray', '4,8');
  });

  /* ── Nodes & links ──────────────────────────────────────── */
  var CENTER = { id: 'center', label: 'C\u00f4me\nNottaris', color: '#84ADDC', r: 50, fx: W/2, fy: H/2, isCenter: true };

  var allNodes = [CENTER];
  PROJECTS.forEach(function(p) { allNodes.push(Object.assign({}, p, { isProject: true })); });
  SKILLS.forEach(function(s) { allNodes.push(Object.assign({}, s, { isSkill: true })); });

  var allLinks = [];
  PROJECTS.forEach(function(p) { allLinks.push({ source: 'center', target: p.id, type: 'core' }); });
  PROJ_SKILL_LINKS.forEach(function(l) { allLinks.push({ source: l.source, target: l.target, type: 'skill' }); });

  /* ── Simulation ─────────────────────────────────────────── */
  var simulation = d3.forceSimulation(allNodes)
    .force('link', d3.forceLink(allLinks).id(function(d) { return d.id; })
      .distance(function(d) { return d.type === 'core' ? 170 : 110; })
      .strength(function(d) { return d.type === 'core' ? 0.7 : 0.3; }))
    .force('charge', d3.forceManyBody().strength(function(d) {
      return d.isCenter ? -800 : d.isProject ? -300 : -100;
    }))
    .force('center', d3.forceCenter(W/2, H/2).strength(0.02))
    .force('collision', d3.forceCollide().radius(function(d) { return d.r + 12; }))
    .force('x', d3.forceX(W/2).strength(0.04))
    .force('y', d3.forceY(H/2).strength(0.04));

  /* ── Links ──────────────────────────────────────────────── */
  var linkLayer = svg.append('g');
  var linkEls = linkLayer.selectAll('line')
    .data(allLinks).enter().append('line')
    .attr('stroke', function(d) { return d.type === 'core' ? '#1a2a44' : '#0e1520'; })
    .attr('stroke-width', function(d) { return d.type === 'core' ? 1.5 : 0.7; })
    .attr('stroke-opacity', function(d) { return d.type === 'core' ? 0.7 : 0.4; });

  /* ── Nodes ──────────────────────────────────────────────── */
  var nodeLayer = svg.append('g');
  var nodeG = nodeLayer.selectAll('g')
    .data(allNodes).enter().append('g')
    .attr('cursor', function(d) { return d.isProject ? 'pointer' : 'default'; })
    .call(d3.drag()
      .on('start', function(evt, d) {
        if (!evt.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', function(evt, d) { d.fx = evt.x; d.fy = evt.y; })
      .on('end', function(evt, d) {
        if (!evt.active) simulation.alphaTarget(0);
        if (!d.isCenter) { d.fx = null; d.fy = null; }
      })
    );

  /* Outer glow ring for projects */
  nodeG.filter(function(d) { return d.isProject; }).append('circle')
    .attr('r', function(d) { return d.r + 8; })
    .attr('fill', 'none')
    .attr('stroke', function(d) { return d.color; })
    .attr('stroke-width', 0.5)
    .attr('stroke-opacity', 0.3)
    .attr('filter', 'url(#glow)');

  /* Pulsing ring for center */
  var pulseRing = nodeG.filter(function(d) { return d.isCenter; }).append('circle')
    .attr('r', 50)
    .attr('fill', 'none')
    .attr('stroke', '#84ADDC')
    .attr('stroke-width', 1)
    .attr('stroke-opacity', 0.4);

  /* Main circle */
  nodeG.append('circle')
    .attr('class', 'main-circle')
    .attr('r', function(d) { return d.r; })
    .attr('fill', function(d) { return d.color; })
    .attr('fill-opacity', function(d) { return d.isCenter ? 0.12 : d.isProject ? 0.1 : 0.08; })
    .attr('stroke', function(d) { return d.color; })
    .attr('stroke-width', function(d) { return d.isCenter ? 2.5 : d.isProject ? 1.5 : 0.8; })
    .attr('filter', function(d) { return d.isCenter ? 'url(#glow-s)' : d.isProject ? 'url(#glow)' : null; });

  /* Labels */
  nodeG.each(function(d) {
    var g = d3.select(this);
    var lines = d.label.split('\n');
    var fontSize = d.isCenter ? 13 : d.isProject ? 10 : 8;
    lines.forEach(function(line, idx) {
      g.append('text')
        .attr('text-anchor', 'middle')
        .attr('dy', (idx - (lines.length-1)/2) * (fontSize + 3) + 1)
        .attr('fill', d.isCenter ? '#fff' : d.isProject ? '#ddd' : '#999')
        .attr('font-size', fontSize + 'px')
        .attr('font-weight', d.isCenter ? '700' : d.isProject ? '600' : '400')
        .attr('font-family', 'Inter, sans-serif')
        .attr('pointer-events', 'none')
        .text(line);
    });
    if (d.isProject && d.subtitle) {
      g.append('text')
        .attr('text-anchor', 'middle')
        .attr('dy', d.r + 14)
        .attr('fill', d.color)
        .attr('font-size', '8px')
        .attr('font-weight', '600')
        .attr('font-family', 'Inter, sans-serif')
        .attr('pointer-events', 'none')
        .attr('opacity', 0.7)
        .text(d.subtitle);
    }
  });

  /* ── Interactions ───────────────────────────────────────── */
  nodeG.on('mousemove', function(evt, d) {
    if (d.isCenter) return;
    d3.select(this).select('.main-circle')
      .transition().duration(150)
      .attr('fill-opacity', d.isProject ? 0.3 : 0.2)
      .attr('stroke-width', d.isProject ? 3 : 2);

    linkEls.transition().duration(150)
      .attr('stroke', function(l) {
        return (l.source.id === d.id || l.target.id === d.id) ? d.color : (l.type === 'core' ? '#0a1220' : '#080c14');
      })
      .attr('stroke-opacity', function(l) {
        return (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.1;
      })
      .attr('stroke-width', function(l) {
        return (l.source.id === d.id || l.target.id === d.id) ? 2 : (l.type === 'core' ? 0.8 : 0.4);
      });

    nodeG.select('.main-circle').transition().duration(150)
      .attr('fill-opacity', function(n) {
        if (n.id === d.id) return d.isProject ? 0.3 : 0.2;
        var connected = allLinks.some(function(l) {
          return (l.source.id === d.id && l.target.id === n.id) ||
                 (l.target.id === d.id && l.source.id === n.id);
        });
        return connected ? (n.isProject ? 0.2 : 0.15) : 0.03;
      });

    var tip = d.isProject
      ? '<div class="tt-title">' + d.label.replace(/\n/g,' ') + '</div><div class="tt-sub">' + d.subtitle + '</div><div style="margin-top:4px;color:#666;">Cliquez pour explorer \u2192</div>'
      : '<div class="tt-title">' + d.label + '</div><div class="tt-sub">Comp\u00e9tence</div>';
    showTip(evt, tip);
  })
  .on('mouseleave', function(evt, d) {
    if (d.isCenter) return;
    nodeG.select('.main-circle').transition().duration(300)
      .attr('fill-opacity', function(n) { return n.isCenter ? 0.12 : n.isProject ? 0.1 : 0.08; })
      .attr('stroke-width', function(n) { return n.isCenter ? 2.5 : n.isProject ? 1.5 : 0.8; });
    linkEls.transition().duration(300)
      .attr('stroke', function(l) { return l.type === 'core' ? '#1a2a44' : '#0e1520'; })
      .attr('stroke-width', function(l) { return l.type === 'core' ? 1.5 : 0.7; })
      .attr('stroke-opacity', function(l) { return l.type === 'core' ? 0.7 : 0.4; });
    hideTip();
  })
  .on('click', function(evt, d) {
    if (d.isProject) {
      var proj = PROJECTS.find(function(p) { return p.id === d.id; });
      if (proj) openProject(proj);
    }
  });

  /* ── Tick ────────────────────────────────────────────────── */
  simulation.on('tick', function() {
    allNodes.forEach(function(d) {
      if (!d.isCenter) {
        d.x = Math.max(d.r + 10, Math.min(W - d.r - 10, d.x));
        d.y = Math.max(d.r + 10, Math.min(H - d.r - 10, d.y));
      }
    });
    linkEls.attr('x1', function(d) { return d.source.x; }).attr('y1', function(d) { return d.source.y; })
      .attr('x2', function(d) { return d.target.x; }).attr('y2', function(d) { return d.target.y; });
    nodeG.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
  });

  /* ── Animated particles along core links ────────────────── */
  var particleLayer = svg.append('g');

  function emitParticle() {
    var coreLinks = allLinks.filter(function(l) { return l.type === 'core'; });
    var lnk = coreLinks[Math.floor(Math.random() * coreLinks.length)];
    if (!lnk || !lnk.source.x) return;

    var dx = lnk.target.x - lnk.source.x;
    var dy = lnk.target.y - lnk.source.y;
    var col = (typeof lnk.target === 'object') ? lnk.target.color : '#84ADDC';

    var p = particleLayer.append('circle')
      .attr('r', 1.5 + Math.random() * 1.5)
      .attr('fill', col)
      .attr('opacity', 0.8)
      .attr('cx', lnk.source.x)
      .attr('cy', lnk.source.y);

    p.transition()
      .duration(1500 + Math.random() * 1500)
      .ease(d3.easeQuadInOut)
      .attr('cx', lnk.source.x + dx * (0.3 + Math.random() * 0.7))
      .attr('cy', lnk.source.y + dy * (0.3 + Math.random() * 0.7))
      .attr('opacity', 0)
      .attr('r', 0.3)
      .remove();
  }

  /* Start particles when visible */
  var particleInterval = null;
  var partObs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting && !particleInterval) {
        particleInterval = setInterval(emitParticle, 300);
        partObs.disconnect();
      }
    });
  }, { threshold: 0.2 });
  partObs.observe(container);

  /* ── Pulse animation for center ─────────────────────────── */
  function pulse() {
    pulseRing
      .attr('r', 50).attr('stroke-opacity', 0.4)
      .transition().duration(2000).ease(d3.easeQuadOut)
      .attr('r', 75).attr('stroke-opacity', 0)
      .on('end', pulse);
  }
  pulse();

  /* ── Twinkling stars ────────────────────────────────────── */
  function twinkle() {
    starLayer.selectAll('circle')
      .filter(function() { return Math.random() < 0.03; })
      .transition().duration(600)
      .attr('opacity', 0.6)
      .transition().duration(600)
      .attr('opacity', 0.04 + Math.random() * 0.3);
    setTimeout(twinkle, 400);
  }
  twinkle();

})();
</script>
</body>
</html>
